e="11.5" text-anchor="middle" x="246.875" y="809">Aprova ou rejeita</text><line stroke="#2563EB" stroke-dasharray="none" stroke-width="2" x1="388.75" x2="672.5" y1="895" y2="895" /><polygon fill="#2563EB" points="672.5,895 662.5,890 662.5,900" /><rect fill="#F7FAFC" height="22" rx="3" width="217.2" x="425.025" y="864" /><text fill="#14314B" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="530.625" y="881">POST /ai-suggestions/{id}/review</text><line stroke="#2563EB" stroke-dasharray="none" stroke-width="2" x1="672.5" x2="1240.0" y1="967" y2="967" /><polygon fill="#2563EB" points="1240.0,967 1230.0,962 1230.0,972" /><rect fill="#F7FAFC" height="22" rx="3" width="289.8" x="814.35" y="936" /><text fill="#14314B" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="956.25" y="953">Revisão + alterações auditadas em transação</text><line stroke="#64748B" stroke-dasharray="6 5" stroke-width="2" x1="1240.0" x2="672.5" y1="1039" y2="1039" /><polygon fill="#64748B" points="672.5,1039 682.5,1034 682.5,1044" /><rect fill="#F7FAFC" height="22" rx="3" width="118.19999999999999" x="900.15" y="1008" /><text fill="#14314B" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="956.25" y="1025">Commit confirmado</text><line stroke="#64748B" stroke-dasharray="6 5" stroke-width="2" x1="672.5" x2="388.75" y1="1111" y2="1111" /><polygon fill="#64748B" points="388.75,1111 398.75,1106 398.75,1116" /><rect fill="#F7FAFC" height="22" rx="3" width="157.79999999999998" x="454.725" y="1080" /><text fill="#14314B" font-family="DejaVu Sans" font-size="11.5" text-anchor="middle" x="530.625" y="1097">Confirma decisão humana</text><text fill="#64748B" font-family="DejaVu Sans" font-size="13" x="46" y="1285">Fallback: se a IA falhar ou responder fora do esquema, a triagem manual continua disponível.</text></svg>