name: Backend Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulseops
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: pulseops_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseops -d pulseops_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://pulseops:test_password@localhost:5432/pulseops_ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U pulseops \
            -d pulseops_ai \
            -v ON_ERROR_STOP=1 \
            -f db/init/01_schema.sql

          PGPASSWORD=test_password psql \
            -h localhost \
            -U pulseops \
            -d pulseops_ai \
            -v ON_ERROR_STOP=1 \
            -f db/init/02_seed_demo.sql

      - name: Run SQL smoke tests
        run: |
          PGPASSWORD=test_password psql \
            -h localhost \
            -U pulseops \
            -d pulseops_ai \
            -v ON_ERROR_STOP=1 \
            -f db/tests/01_smoke_tests.sql

      - name: Run Python tests
        working-directory: backend
        run: python -m pytest -v
