# Complementa compose.yaml: adiciona backend/frontend sem substituir os dados.
# Execute: docker compose -f compose.yaml -f compose.app.yaml up -d --build
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:?Defina POSTGRES_DB}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY com pelo menos 32 caracteres}"
      APP_ENVIRONMENT: production
      CORS_ORIGINS: ""
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-120}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Opcional: imagem do modelo processada no container. Sem porta publicada.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
